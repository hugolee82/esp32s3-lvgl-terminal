; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.5.0    ; 指定 ESP32 开发平台版本      
board = esp32-s3-devkitc-1        ; 开发板型号       
framework = arduino               ; 开发框架       
board_build.arduino.partitions = default_16MB.csv ; 指定分区表（适配 16MB Flash）
board_build.arduino.memory_type = qio_opi ; 指定 PSRAM/Flash 接口模式 (QIO/OPI)
build_flags =
    -D BOARD_HAS_PSRAM            ; 启用 PSRAM 宏定义
    -D LV_CONF_INCLUDE_SIMPLE     ; 使用项目 include/lv_conf.h,避免 libdeps 里配置被库重装重置
board_upload.flash_size = 16MB    ; 指定 Flash 大小          
upload_speed = 921600             ; 烧录波特率(500000 非标准,部分线材/CH340 不稳)
upload_port = COM7                ; CH340 实际串口号,避免自动误选蓝牙虚拟串口

lib_deps =
    lvgl/lvgl@^8.3.9      ; LVGL库
    bodmer/TFT_eSPI@2.5.0 ; 显示库
    fbiego/CST816S@^1.1.1 ; 触摸库
    bblanchon/ArduinoJson@^6.21.4 ; json解析库
    esphome/ESP32-audioI2S@^2.0.7 ; 音频库
    https://github.com/CaddonThaw/lvgl-games.git